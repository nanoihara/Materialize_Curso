<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Precisa carregar o jQuery primeiro... -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Materialize CDN -->
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <!-- Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>
<body>

    <!-- Usando RADIO -->
    <div class="container">
        <form action="">

            <!-- Não é obrigatório colocar id -->

            <!-- Se colocar classe "with-gap", deixa um espacinho dentro do radio (estético) -->
            <p><label for="m"><input type="radio" name="sexo" id="m"><span>Masculino</span></label></p>
            <p><label for="f"><input class="with-gap" type="radio" name="sexo" id="f"><span>Feminino</span></label></p>
        </form>
    </div>
    
    <!-- Usando SELECT -->
    <div class="container">
        <form action="">
            <select name="" id="">

                <!-- É possível colocar imagens junto nas opções -->
                <option value="" data-icon="img/lana ihara - profile picture.png">opção 1</option>
                <option value="">opção 2</option>
                <option value="">opção 3</option>
            </select>
        </form>
    </div>

    <!-- Usando CHECKBOX / SWITCH -->
    <div class="container">
        <div class="switch">
            <label>
                Off
                <input type="checkbox">
                <span class="lever"></span>
                On
            </label>
        </div>
    </div>

    <!-- Ctrl + shift + r para limpar o cache do navegador -->
    
    <!-- Usando FORMULÁRIO -->
    <div class="container">
        <div class="input-field">

            <!-- Válido --> 
            <input type="text" id="campo_nome">
            <label for="campo_text">Nome:</label>
            <span class="helper-text">Digite o seu nome</span>
        </div>

        <div class="input-field">
            
            <!-- Inválido -->
            <!-- Contudo, precisaria fazer um código JS para colocar a class "invalid" de acordo com a condição desejada -->
            <input type="text" id="nome_erro" class="invalid">
            <label for="nome_erro">Nome:</label>
            <span class="helper-text" data-error="Erro">Digite o seu nome</span>
        </div>
    </div>

    <script>

        // Script do SELECT
        $('select').formSelect();
    </script>
</body>
</html>
